app:
  name: "HeartChat情感分析"
  description: "基于多模型的智能情感分析工作流，为HeartChat提供精准的情感识别和情商提升建议"
  icon: "heart"
  icon_background: "#FFE4E1"
  mode: "workflow"
  enable_site: true
  enable_api: true

workflow:
  graph:
    - node_id: "start"
      type: "start"
      position:
        x: 89
        y: 382
      title: "开始"
      desc: "工作流起始节点"
      outputs:
        - variable_selector: ["text"]
          value_selector: ["text"]
        - variable_selector: ["user_id"]
          value_selector: ["user_id"]
        - variable_selector: ["session_id"]
          value_selector: ["session_id"]
        - variable_selector: ["context"]
          value_selector: ["context"]

    - node_id: "text_preprocessing"
      type: "code"
      position:
        x: 289
        y: 382
      title: "文本预处理"
      desc: "清理文本、提取关键词、统计特征"
      inputs:
        - variable_selector: ["text"]
          value_selector: ["text"]
      outputs:
        - variable_selector: ["cleaned_text"]
          value_selector: ["cleaned_text"]
        - variable_selector: ["keywords"]
          value_selector: ["keywords"]
        - variable_selector: ["text_stats"]
          value_selector: ["text_stats"]
      code_language: "javascript"
      code: |
        // 文本预处理函数
        function preprocessText(text) {
          // 去除特殊字符，保留中文、英文、数字和基本标点
          let cleanedText = text.replace(/[^\u4e00-\u9fa5\w\s\.,!?，。！？、；：""''（）【】]/g, '');
          cleanedText = cleanedText.trim();
          
          // 提取关键词（简单实现，实际可使用更复杂的算法）
          const keywords = extractKeywords(cleanedText);
          
          // 文本统计
          const textStats = {
            length: cleanedText.length,
            sentence_count: cleanedText.split(/[。！？.!?]/).filter(s => s.trim()).length,
            emotion_words: detectEmotionWords(cleanedText),
            complexity: calculateComplexity(cleanedText)
          };
          
          return {
            cleaned_text: cleanedText,
            keywords: keywords,
            text_stats: textStats
          };
        }
        
        // 提取关键词
        function extractKeywords(text) {
          // 简单的关键词提取，基于词频和词性
          const words = text.split(/[\s，。、；：！？.!?]+/).filter(w => w.length > 1);
          const wordFreq = {};
          
          words.forEach(word => {
            wordFreq[word] = (wordFreq[word] || 0) + 1;
          });
          
          // 返回频率最高的5个词
          return Object.entries(wordFreq)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 5)
            .map(([word]) => word);
        }
        
        // 检测情感词汇
        function detectEmotionWords(text) {
          const emotionWords = {
            positive: ['高兴', '开心', '快乐', '满足', '兴奋', '喜悦', '感激', '希望', '自豪', '自信'],
            negative: ['难过', '伤心', '失望', '沮丧', '焦虑', '愤怒', '害怕', '紧张', '痛苦', '孤独']
          };
          
          const detected = {
            positive: 0,
            negative: 0,
            words: []
          };
          
          Object.entries(emotionWords).forEach(([type, words]) => {
            words.forEach(word => {
              if (text.includes(word)) {
                detected[type]++;
                detected.words.push(word);
              }
            });
          });
          
          return detected;
        }
        
        // 计算文本复杂度
        function calculateComplexity(text) {
          const sentences = text.split(/[。！？.!?]/).filter(s => s.trim());
          const avgSentenceLength = text.length / sentences.length;
          const uniqueWords = new Set(text.split(/[\s，。、；：！？.!?]+/)).size;
          const totalWords = text.split(/[\s，。、；：！？.!?]+/).length;
          
          // 复杂度 = (平均句长 * 唯一词比例) / 总词数
          return (avgSentenceLength * (uniqueWords / totalWords)) / 100;
        }
        
        // 执行预处理
        const result = preprocessText(text);
        
        return {
          cleaned_text: result.cleaned_text,
          keywords: result.keywords,
          text_stats: result.text_stats
        };

    - node_id: "model_router"
      type: "condition"
      position:
        x: 489
        y: 382
      title: "模型选择路由"
      desc: "根据文本复杂度选择最合适的AI模型"
      inputs:
        - variable_selector: ["text_stats"]
          value_selector: ["text_stats"]
      outputs:
        - variable_selector: ["selected_model"]
          value_selector: ["selected_model"]
        - variable_selector: ["model_reason"]
          value_selector: ["model_reason"]
      conditions:
        - condition: "${text_stats.complexity#lt#0.3}"
          value:
            selected_model: "gpt-3.5-turbo"
            model_reason: "文本简单，使用GPT-3.5处理"
        - condition: "${text_stats.complexity#lt#0.7}"
          value:
            selected_model: "glm-4"
            model_reason: "文本中等复杂度，使用GLM-4处理"
        - condition: "${text_stats.complexity#ge#0.7}"
          value:
            selected_model: "gpt-4"
            model_reason: "文本复杂，使用GPT-4深度分析"

    - node_id: "emotion_analysis"
      type: "llm"
      position:
        x: 689
        y: 382
      title: "情感分析"
      desc: "使用选定的AI模型进行深度情感分析"
      inputs:
        - variable_selector: ["cleaned_text"]
          value_selector: ["cleaned_text"]
        - variable_selector: ["context"]
          value_selector: ["context"]
        - variable_selector: ["selected_model"]
          value_selector: ["selected_model"]
      outputs:
        - variable_selector: ["emotion_result"]
          value_selector: ["emotion_result"]
      model:
        provider: "openai"
        name: "${selected_model}"
        mode: "chat"
        completion_params:
          temperature: 0.3
          max_tokens: 2000
          top_p: 0.9
      prompt_template: |
        你是一个专业的情感分析AI助手，具备强大的多模态理解和上下文分析能力。作为HeartChat情商提升应用的核心分析引擎，请深入分析用户的情感表达，并提供有价值的情商发展建议。
        
        **分析任务**：
        请分析以下文本的情感内容，并参考对话历史（如有）来理解情感的发展脉络。
        
        **待分析文本**：
        "{{{cleaned_text}}}"
        
        {{#context}}
        **对话上下文**：
        {{{context}}}
        {{/context}}
        
        **分析要求**：
        
        ### 1. 情感识别（核心能力）
        - 运用8大类32子类情感体系进行精准分类
        - 识别表面情感下的深层情感需求
        - 注意中文情感表达的含蓄性和复杂性
        - 考虑年龄、文化背景对表达方式的影响
        
        ### 2. 情感强度分析
        - 基于词汇、语境、表达方式综合评估强度
        - 识别情感表达的克制或夸张程度
        - 判断真实的情感强度vs表面表达强度
        
        ### 3. 情感趋势判断
        - 分析与历史对话的情感变化轨迹
        - 识别情感转变的关键节点和触发因素
        - 预测情感发展的可能方向
        
        ### 4. 情感模式识别
        - 判断当前情感属于哪种模式类型（爆发型、累积型、波动型、压抑型、转移型、循环型、复合型、稳定型）
        - 分析该模式在用户情感表达中的典型性
        - 识别模式背后的心理机制
        
        ### 5. 情商提升建议
        - 基于当前情感状态提供具体可行的情商建议
        - 建议应包含认知、行为、表达三个层面
        - 考虑用户的接受度和实施可行性
        
        ### 6. 风险评估
        - 评估当前情感状态的风险等级（0-5分）
        - 识别潜在的危险信号
        - 提供适当的支持建议
        
        **输出格式要求**：
        请严格按照以下JSON格式返回分析结果，确保所有中文字段使用中文表达：
        
        {
          "primary_emotion": "主要情感类型",
          "secondary_emotions": ["次要情感1", "次要情感2"],
          "intensity": 0.0-1.0的数值,
          "valence": -1.0到1.0的数值,
          "arousal": 0.0到1.0的数值,
          "trend": "上升/下降/稳定",
          "trend_en": "rising/falling/stable",
          "attention_level": "高/中/低",
          "attention_level_en": "high/medium/low",
          "radar_dimensions": {
            "trust": 0.0-1.0,
            "openness": 0.0-1.0,
            "resistance": 0.0-1.0,
            "stress": 0.0-1.0,
            "control": 0.0-1.0
          },
          "topic_keywords": ["主题关键词1", "主题关键词2"],
          "emotion_triggers": ["触发词1", "触发词2"],
          "emotion_pattern": "情感模式类型",
          "change_rate": 0.0-1.0,
          "triggers_analysis": "触发因素的深度分析",
          "eq_suggestions": ["情商建议1", "情商建议2", "情商建议3"],
          "risk_level": 0-5的数值,
          "context_influence": 0.0-1.0,
          "suggestions": ["建议1", "建议2"],
          "summary": "情感状态总结"
        }

    - node_id: "result_validation"
      type: "code"
      position:
        x: 889
        y: 382
      title: "结果验证"
      desc: "验证情感分析结果的格式和有效性"
      inputs:
        - variable_selector: ["emotion_result"]
          value_selector: ["emotion_result"]
      outputs:
        - variable_selector: ["validated_result"]
          value_selector: ["validated_result"]
        - variable_selector: ["validation_status"]
          value_selector: ["validation_status"]
      code_language: "javascript"
      code: |
        // 验证情感分析结果
        function validateEmotionResult(result) {
          try {
            // 如果是字符串，尝试解析为JSON
            if (typeof result === 'string') {
              result = JSON.parse(result);
            }
            
            // 检查必需字段
            const requiredFields = [
              'primary_emotion', 'intensity', 'valence', 'arousal',
              'trend', 'attention_level', 'emotion_pattern'
            ];
            
            const missingFields = requiredFields.filter(field => !(field in result));
            if (missingFields.length > 0) {
              return {
                status: 'error',
                message: `缺少必需字段: ${missingFields.join(', ')}`,
                result: null
              };
            }
            
            // 验证数值范围
            const numberFields = {
              intensity: [0, 1],
              valence: [-1, 1],
              arousal: [0, 1],
              change_rate: [0, 1],
              context_influence: [0, 1]
            };
            
            for (const [field, [min, max]] of Object.entries(numberFields)) {
              if (field in result && (typeof result[field] !== 'number' || result[field] < min || result[field] > max)) {
                return {
                  status: 'error',
                  message: `${field} 字段值必须在 ${min} 到 ${max} 之间`,
                  result: null
                };
              }
            }
            
            // 验证风险等级
            if (result.risk_level && (typeof result.risk_level !== 'number' || result.risk_level < 0 || result.risk_level > 5)) {
              return {
                status: 'error',
                message: 'risk_level 必须是 0-5 之间的数值',
                result: null
              };
            }
            
            // 验证雷达图维度
            if (result.radar_dimensions) {
              const radarFields = ['trust', 'openness', 'resistance', 'stress', 'control'];
              for (const field of radarFields) {
                if (field in result.radar_dimensions && (typeof result.radar_dimensions[field] !== 'number' || result.radar_dimensions[field] < 0 || result.radar_dimensions[field] > 1)) {
                  return {
                    status: 'error',
                    message: `radar_dimensions.${field} 必须是 0-1 之间的数值`,
                    result: null
                  };
                }
              }
            }
            
            // 设置默认值
            const validatedResult = {
              primary_emotion: result.primary_emotion || '未知',
              secondary_emotions: result.secondary_emotions || [],
              intensity: result.intensity || 0.5,
              valence: result.valence || 0.0,
              arousal: result.arousal || 0.5,
              trend: result.trend || '稳定',
              trend_en: result.trend_en || 'stable',
              attention_level: result.attention_level || '中',
              attention_level_en: result.attention_level_en || 'medium',
              radar_dimensions: result.radar_dimensions || {
                trust: 0.5, openness: 0.5, resistance: 0.5, stress: 0.5, control: 0.5
              },
              topic_keywords: result.topic_keywords || [],
              emotion_triggers: result.emotion_triggers || [],
              emotion_pattern: result.emotion_pattern || '稳定型',
              change_rate: result.change_rate || 0.0,
              triggers_analysis: result.triggers_analysis || '',
              eq_suggestions: result.eq_suggestions || [],
              risk_level: result.risk_level || 0,
              context_influence: result.context_influence || 0.5,
              suggestions: result.suggestions || [],
              summary: result.summary || '情感状态分析完成'
            };
            
            return {
              status: 'success',
              message: '验证通过',
              result: validatedResult
            };
            
          } catch (error) {
            return {
              status: 'error',
              message: `JSON解析错误: ${error.message}`,
              result: null
            };
          }
        }
        
        // 执行验证
        const validation = validateEmotionResult(emotion_result);
        
        return {
          validated_result: validation.result,
          validation_status: validation.status
        };

    - node_id: "risk_assessment"
      type: "condition"
      position:
        x: 1089
        y: 382
      title: "风险评估"
      desc: "根据情感分析结果评估风险等级"
      inputs:
        - variable_selector: ["validated_result"]
          value_selector: ["validated_result"]
      outputs:
        - variable_selector: ["risk_level"]
          value_selector: ["risk_level"]
        - variable_selector: ["risk_actions"]
          value_selector: ["risk_actions"]
        - variable_selector: ["requires_attention"]
          value_selector: ["requires_attention"]
      conditions:
        - condition: "${validated_result.risk_level#ge#4}"
          value:
            risk_level: "高风险"
            risk_actions: ["立即关注", "建议专业帮助", "持续监控", "联系支持人员"]
            requires_attention: true
        - condition: "${validated_result.risk_level#ge#3}"
          value:
            risk_level: "中风险"
            risk_actions: ["适当关注", "提供支持资源", "建议自我调节", "定期检查"]
            requires_attention: true
        - condition: "${validated_result.risk_level#lt#3}"
          value:
            risk_level: "低风险"
            risk_actions: ["正常监控", "保持关注", "提供一般建议"]
            requires_attention: false

    - node_id: "enhancement_suggestions"
      type: "llm"
      position:
        x: 1289
        y: 382
      title: "增强建议生成"
      desc: "基于情感分析结果生成个性化的情商提升建议"
      inputs:
        - variable_selector: ["validated_result"]
          value_selector: ["validated_result"]
        - variable_selector: ["risk_level"]
          value_selector: ["risk_level"]
      outputs:
        - variable_selector: ["enhanced_suggestions"]
          value_selector: ["enhanced_suggestions"]
      model:
        provider: "openai"
        name: "gpt-4"
        mode: "chat"
        completion_params:
          temperature: 0.4
          max_tokens: 1500
          top_p: 0.9
      prompt_template: |
        基于以下情感分析结果，为HeartChat用户提供个性化、具体可行的情商提升建议：
        
        **情感状态**：
        - 主要情感：{{{validated_result.primary_emotion}}}
        - 情感强度：{{{validated_result.intensity}}}
        - 情感模式：{{{validated_result.emotion_pattern}}}
        - 风险等级：{{{risk_level}}}
        
        **详细分析**：
        - 情感触发因素：{{{validated_result.triggers_analysis}}}
        - 上下文影响：{{{validated_result.context_influence}}}
        - 雷达维度分析：{{{validated_result.radar_dimensions}}}
        
        请为用户提供三个层面的具体建议：
        
        1. **认知层面**：帮助用户更好地理解这种情感，提升情感认知能力
        2. **行为层面**：提供具体的行动建议，帮助用户有效应对这种情感
        3. **表达层面**：指导用户如何更健康、更有效地表达这种情感
        
        **要求**：
        - 建议要具体、可操作，避免空泛
        - 考虑用户的风险等级和接受能力
        - 结合中国文化背景和实际情况
        - 语言要温暖、支持性、建设性
        
        请以JSON格式返回建议：
        {
          "cognitive_suggestions": ["认知建议1", "认知建议2"],
          "behavioral_suggestions": ["行为建议1", "行为建议2"], 
          "expressive_suggestions": ["表达建议1", "表达建议2"],
          "immediate_actions": ["可立即采取的行动1", "可立即采取的行动2"],
          "long_term_goals": ["长期目标1", "长期目标2"]
        }

    - node_id: "data_integration"
      type: "code"
      position:
        x: 1489
        y: 382
      title: "数据整合"
      desc: "整合所有分析结果，准备最终输出"
      inputs:
        - variable_selector: ["validated_result"]
          value_selector: ["validated_result"]
        - variable_selector: ["enhanced_suggestions"]
          value_selector: ["enhanced_suggestions"]
        - variable_selector: ["risk_actions"]
          value_selector: ["risk_actions"]
        - variable_selector: ["requires_attention"]
          value_selector: ["requires_attention"]
        - variable_selector: ["text_stats"]
          value_selector: ["text_stats"]
      outputs:
        - variable_selector: ["final_result"]
          value_selector: ["final_result"]
      code_language: "javascript"
      code: |
        // 整合所有分析结果
        function integrateResults(emotionResult, suggestions, riskActions, requiresAttention, textStats) {
          // 解析增强建议
          let enhancedSuggestions = {};
          try {
            if (typeof suggestions === 'string') {
              enhancedSuggestions = JSON.parse(suggestions);
            } else {
              enhancedSuggestions = suggestions || {};
            }
          } catch (error) {
            console.error('解析增强建议失败:', error);
            enhancedSuggestions = {};
          }
          
          // 构建最终结果
          const finalResult = {
            // 基本信息
            timestamp: new Date().toISOString(),
            analysis_id: generateAnalysisId(),
            
            // 原始分析结果
            emotion_analysis: emotionResult,
            
            // 增强建议
            enhanced_suggestions: enhancedSuggestions,
            
            // 风险评估
            risk_assessment: {
              level: emotionResult.risk_level,
              category: getRiskCategory(emotionResult.risk_level),
              actions: riskActions,
              requires_attention: requiresAttention
            },
            
            // 文本分析统计
            text_analysis: textStats,
            
            // 元数据
            metadata: {
              model_used: "${selected_model}",
              analysis_duration: Date.now() - startTime,
              confidence_score: calculateConfidenceScore(emotionResult),
              processing_steps: [
                "文本预处理",
                "模型选择",
                "情感分析", 
                "结果验证",
                "风险评估",
                "建议生成",
                "数据整合"
              ]
            },
            
            // 输出摘要
            summary: {
              primary_emotion: emotionResult.primary_emotion,
              risk_status: requires_attention ? "需要关注" : "正常",
              recommendation_count: (
                (enhancedSuggestions.cognitive_suggestions?.length || 0) +
                (enhancedSuggestions.behavioral_suggestions?.length || 0) +
                (enhancedSuggestions.expressive_suggestions?.length || 0)
              ),
              next_steps: generateNextSteps(emotionResult, enhancedSuggestions, requiresAttention)
            }
          };
          
          return finalResult;
        }
        
        // 生成分析ID
        function generateAnalysisId() {
          return 'analysis_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // 获取风险类别
        function getRiskCategory(riskLevel) {
          if (riskLevel >= 4) return 'high';
          if (riskLevel >= 3) return 'medium';
          return 'low';
        }
        
        // 计算置信度分数
        function calculateConfidenceScore(emotionResult) {
          let score = 0.5; // 基础分数
          
          // 根据强度和一致性调整
          if (emotionResult.intensity > 0.7) score += 0.2;
          if (emotionResult.radar_dimensions.trust > 0.7) score += 0.1;
          if (emotionResult.radar_dimensions.openness > 0.7) score += 0.1;
          if (emotionResult.radar_dimensions.resistance < 0.3) score += 0.1;
          
          return Math.min(score, 1.0);
        }
        
        // 生成后续步骤
        function generateNextSteps(emotionResult, suggestions, requiresAttention) {
          const steps = [];
          
          if (requiresAttention) {
            steps.push("立即关注用户情感状态");
            steps.push("考虑建议专业帮助");
          }
          
          if (emotionResult.risk_level >= 3) {
            steps.push("安排后续跟进");
          }
          
          if (suggestions.cognitive_suggestions?.length > 0) {
            steps.push("提供认知层面指导");
          }
          
          if (suggestions.behavioral_suggestions?.length > 0) {
            steps.push("推荐具体行动方案");
          }
          
          return steps;
        }
        
        // 记录开始时间（实际应用中应该在流程开始时记录）
        const startTime = Date.now() - 1000; // 模拟处理时间
        
        // 执行数据整合
        const finalResult = integrateResults(
          validated_result,
          enhanced_suggestions,
          risk_actions,
          requires_attention,
          text_stats
        );
        
        return {
          final_result: finalResult
        };

    - node_id: "data_storage"
      type: "http_request"
      position:
        x: 1689
        y: 382
      title: "数据存储"
      desc: "将分析结果存储到数据库"
      inputs:
        - variable_selector: ["final_result"]
          value_selector: ["final_result"]
        - variable_selector: ["user_id"]
